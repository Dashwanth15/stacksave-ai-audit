<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Ambient Dashboard Aura -->
    <radialGradient id="ambient-mint" cx="28%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-cyan" cx="82%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Main Slate Surface Gradient -->
    <linearGradient id="slate-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Card 1 Surface Gradient (Mint Tinted) -->
    <linearGradient id="mint-card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2fcf7" />
      <stop offset="100%" stop-color="#e8f9f0" />
    </linearGradient>

    <!-- Emerald Bar Chart Gradient -->
    <linearGradient id="bar-chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sparkline Fill Gradient -->
    <linearGradient id="chart-area-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logo-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Tilted Slate Drop Shadow Filter -->
    <filter id="slate-shadow" x="-12%" y="-12%" width="128%" height="138%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.09" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Mint Card Elevation Shadow Filter -->
    <filter id="card-green-shadow" x="-25%" y="-25%" width="150%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#10b981" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- White Cards Elevation Shadow Filter -->
    <filter id="card-white-shadow" x="-25%" y="-25%" width="150%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.09" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Ambient Container Backdrop -->
  <rect x="0" y="0" width="520" height="360" rx="28" fill="#f8fcfa" fill-opacity="0.5" />
  <rect x="0" y="0" width="520" height="360" rx="28" fill="url(#ambient-mint)" />
  <rect x="0" y="0" width="520" height="360" rx="28" fill="url(#ambient-cyan)" />

  <!-- Subtle Ambient Tech Grid (Top Right) -->
  <g stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.2">
    <line x1="390" y1="10" x2="390" y2="150" />
    <line x1="425" y1="10" x2="425" y2="150" />
    <line x1="460" y1="10" x2="460" y2="150" />
    <line x1="495" y1="10" x2="495" y2="150" />
    <line x1="360" y1="30" x2="510" y2="30" />
    <line x1="360" y1="65" x2="510" y2="65" />
    <line x1="360" y1="100" x2="510" y2="100" />
  </g>

  <!-- ============================================================
       3D TILTED DASHBOARD SLATE
       ============================================================ -->
  <g transform="translate(260, 180) rotate(-3.8) skewX(2) translate(-260, -180)">
    <!-- Base Board with Multi-layer Soft Shadow -->
    <rect
      x="68"
      y="52"
      width="384"
      height="242"
      rx="20"
      fill="url(#slate-surface)"
      stroke="#e2e8f0"
      stroke-width="1.3"
      filter="url(#slate-shadow)"
    />

    <!-- Slate Top Highlight Rim -->
    <path
      d="M 88 52.75 L 432 52.75"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linecap="round"
    />

    <!-- Slate Header: StackSave 'S' Logo Mark -->
    <g transform="translate(96, 76)">
      <!-- Emerald Rounded Emblem -->
      <rect x="0" y="0" width="28" height="28" rx="7.5" fill="url(#logo-emerald-grad)" />
      <!-- Crisp White Stylized S -->
      <path
        d="M 19 8.5 C 19 8.5 11 7.5 10 12.5 C 9 17 18.5 15 18 19.5 C 17.5 23 11 22.5 9 20"
        stroke="#ffffff"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Small Logo Accent Bar -->
      <line x1="6.5" y1="17.5" x2="6.5" y2="20" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Emerald Sparkline Curve Chart -->
    <path
      d="M 210 165
         L 210 125
         C 240 125, 255 142, 280 142
         C 305 142, 318 110, 340 110
         C 362 110, 370 134, 390 134
         C 406 134, 416 78, 428 78
         C 436 78, 442 94, 450 100
         L 450 165
         Z"
      fill="url(#chart-area-fill)"
    />
    <path
      d="M 210 125
         C 240 125, 255 142, 280 142
         C 305 142, 318 110, 340 110
         C 362 110, 370 134, 390 134
         C 406 134, 416 78, 428 78
         C 436 78, 442 94, 450 100"
      fill="none"
      stroke="#10b981"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Sparkline Peak Accent Glow Dot -->
    <circle cx="428" cy="78" r="3.8" fill="#10b981" />
    <circle cx="428" cy="78" r="1.8" fill="#ffffff" />

    <!-- Faint UI Data Rows (Dashboard Skeleton) -->
    <!-- Row 1 -->
    <g transform="translate(96, 136)">
      <circle cx="4" cy="4" r="3.5" fill="#cbd5e1" />
      <rect x="18" y="1" width="85" height="6.5" rx="3.25" fill="#e2e8f0" />
      <rect x="110" y="1" width="50" height="6.5" rx="3.25" fill="#f1f5f9" />
      <!-- Track & Toggle -->
      <rect x="175" y="2" width="44" height="3.5" rx="1.75" fill="#e2e8f0" />
      <circle cx="206" cy="4" r="4.2" fill="#94a3b8" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(96, 168)">
      <circle cx="4" cy="4" r="3.5" fill="#cbd5e1" />
      <rect x="18" y="1" width="105" height="6.5" rx="3.25" fill="#e2e8f0" />
      <rect x="130" y="1" width="40" height="6.5" rx="3.25" fill="#f1f5f9" />
      <!-- Track & Toggle -->
      <rect x="185" y="2" width="44" height="3.5" rx="1.75" fill="#e2e8f0" />
      <circle cx="212" cy="4" r="4.2" fill="#94a3b8" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(96, 200)">
      <circle cx="4" cy="4" r="3.5" fill="#cbd5e1" />
      <rect x="18" y="1" width="75" height="6.5" rx="3.25" fill="#e2e8f0" />
      <rect x="100" y="1" width="60" height="6.5" rx="3.25" fill="#f1f5f9" />
      <!-- Track & Toggle -->
      <rect x="175" y="2" width="44" height="3.5" rx="1.75" fill="#e2e8f0" />
      <circle cx="192" cy="4" r="4.2" fill="#94a3b8" />
    </g>

    <!-- Bottom Pagination Dots -->
    <g transform="translate(156, 246)">
      <circle cx="0" cy="0" r="2.8" fill="#cbd5e1" />
      <circle cx="11" cy="0" r="2.8" fill="#cbd5e1" />
      <circle cx="22" cy="0" r="2.8" fill="#e2e8f0" />
    </g>
  </g>

  <!-- ============================================================
       THE THREE FLOATING INSIGHT CARDS (CRISP FOREGROUND)
       ============================================================ -->

  <!-- ── CARD 1 (LEFT / MINT TINT): "Better decisions. Lower AI spending." ── -->
  <g transform="translate(132, 156) rotate(-2) translate(-132, -156)">
    <!-- Card Container -->
    <rect
      x="20"
      y="120"
      width="226"
      height="70"
      rx="15"
      fill="url(#mint-card-surface)"
      stroke="#a7f3d0"
      stroke-width="1.3"
      filter="url(#card-green-shadow)"
    />

    <!-- Icon: Emerald 3-Bar Chart -->
    <g transform="translate(42, 137)">
      <rect x="0" y="19" width="7.5" height="15" rx="2.8" fill="url(#bar-chart-grad)" />
      <rect x="10.5" y="10" width="7.5" height="24" rx="2.8" fill="url(#bar-chart-grad)" />
      <rect x="21" y="0" width="7.5" height="34" rx="2.8" fill="url(#bar-chart-grad)" />
    </g>

    <!-- Typography -->
    <text
      x="82"
      y="150"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="13.5"
      font-weight="700"
      letter-spacing="-0.2px"
      fill="#0f172a"
    >Better decisions.</text>
    <text
      x="82"
      y="170"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="12.5"
      font-weight="600"
      letter-spacing="-0.15px"
      fill="#1e293b"
    >Lower AI spending.</text>
  </g>

  <!-- ── CARD 2 (TOP-RIGHT / WHITE): "More value. More opportunities." ── -->
  <g transform="translate(395, 102) rotate(-2) translate(-395, -102)">
    <!-- Card Container -->
    <rect
      x="298"
      y="70"
      width="200"
      height="64"
      rx="15"
      fill="#ffffff"
      stroke="#e2e8f0"
      stroke-width="1.3"
      filter="url(#card-white-shadow)"
    />

    <!-- Icon: Emerald Price Tag -->
    <g transform="translate(319, 85)">
      <path
        d="M 14.5 2.5 L 26.5 14.5 C 27.7 15.7 27.7 17.7 26.5 18.9 L 18.9 26.5 C 17.7 27.7 15.7 27.7 14.5 26.5 L 2.5 14.5 C 1.5 13.5 1 12 1 10.8 L 1 3.8 C 1 2.2 2.2 1 3.8 1 L 10.8 1 C 12 1 13.5 1.5 14.5 2.5 Z"
        fill="none"
        stroke="#10b981"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="7" cy="7" r="2.2" fill="#10b981" />
    </g>

    <!-- Typography -->
    <text
      x="358"
      y="98"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="-0.2px"
      fill="#0f172a"
    >More value.</text>
    <text
      x="358"
      y="116"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="11.5"
      font-weight="500"
      letter-spacing="-0.15px"
      fill="#475569"
    >More opportunities.</text>
  </g>

  <!-- ── CARD 3 (BOTTOM-RIGHT / WHITE): "Stay ahead. With StackSave Premium." ── -->
  <g transform="translate(382, 204) rotate(-2) translate(-382, -204)">
    <!-- Card Container -->
    <rect
      x="266"
      y="170"
      width="234"
      height="68"
      rx="15"
      fill="#ffffff"
      stroke="#e2e8f0"
      stroke-width="1.3"
      filter="url(#card-white-shadow)"
    />

    <!-- Icon: Royal Blue User Head & Shoulders -->
    <g transform="translate(288, 186)">
      <!-- Head Circle -->
      <circle cx="16.5" cy="9.5" r="7" fill="none" stroke="#2563eb" stroke-width="2.5" />
      <!-- Shoulders Arc -->
      <path
        d="M 5 31 C 5 23, 10.5 20, 16.5 20 C 22.5 20, 28 23, 28 31"
        fill="none"
        stroke="#2563eb"
        stroke-width="2.5"
        stroke-linecap="round"
      />
    </g>

    <!-- Typography -->
    <text
      x="328"
      y="197"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="13.2"
      font-weight="700"
      letter-spacing="-0.2px"
      fill="#0f172a"
    >Stay ahead.</text>
    <text
      x="328"
      y="217"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="11.5"
      font-weight="500"
      letter-spacing="-0.15px"
      fill="#475569"
    >With StackSave Premium.</text>
  </g>
</svg>
