# Render Deployment Configuration — StackSave AI Audit Frontend
# This file configures automatic deployment from GitHub to Render as a static site

services:
  - type: site
    name: stacksave-frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    publishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stacksave-backend.onrender.com/api
        # IMPORTANT: Update this value after deploying the backend
    # Auto-deploy from main branch
    branch: main
    # Build from the frontend directory
    rootDirectory: frontend
