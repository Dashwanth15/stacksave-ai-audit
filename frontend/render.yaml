# Render Deployment Configuration — StackSave AI Audit Frontend
# This file configures automatic deployment from GitHub to Render

services:
  - type: static
    name: stacksave-round2-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stacksave-round2-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://stacksave-round2-backend.onrender.com/api
      - key: BACKEND_URL
        value: https://stacksave-round2-backend.onrender.com
    # Auto-deploy from round-2-reaudit branch
    branch: round-2-reaudit
    # Build from the frontend directory
    rootDirectory: frontend
    # SPA routing: serve index.html for all routes so React Router handles navigation
    # Without this, direct access to /audit/:id/diff or /results/:id returns 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
