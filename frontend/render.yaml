# Render Deployment Configuration — StackSave AI Audit Frontend
# Deployed as a web service (not static) so server.js handles:
#   - Correct MIME types for CSS/JS assets
#   - SPA fallback routing (React Router)
#   - /api proxy to backend

services:
  - type: web
    name: stacksave-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.stacksaveai.com/api
      - key: VITE_API_URL
        value: https://api.stacksaveai.com/api
      - key: BACKEND_URL
        value: https://api.stacksaveai.com
    # Auto-deploy from main branch
    branch: main
    # Build from the frontend directory
    rootDirectory: frontend
